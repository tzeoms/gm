<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gamermaid - Earn USDT</title>
</head>
<body>
    <div id="earn-dashboard">
        <h2>Your Referral Dashboard</h2>
        <p>Earnings: <strong id="usdt-display">0.00 USDT</strong></p>
        <p><span id="referral-counter">0</span> successful referrals</p>
        
        <h3>Your Referral Link</h3>
        <input type="text" id="referral-link" readonly value="Loading...">
        <button onclick="copyLink()">Copy Link</button>
    </div>

    <!-- This links your HTML to your compiled TypeScript logic -->
    <script type="module" src="../dist/earn.js"></script>

    <script>
        // Simple clipboard copy utility
        function copyLink() {
            const copyText = document.getElementById("referral-link");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Referral link copied!");
        }
    </script>
</body>
</html>
