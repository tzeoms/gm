<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Compressor — Free Online Tool | Gamermaid</title>
  <meta name="description" content="Compress images and shrink file size with an adjustable quality slider, directly in your browser. Free, private, and instant.">
  <link rel="canonical" href="https://gamermaid.site/image-studio/compressor.html">

  <meta property="og:title" content="Image Compressor — Free Online Tool | Gamermaid">
  <meta property="og:description" content="Compress images and shrink file size with an adjustable quality slider, directly in your browser. Free, private, and instant.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gamermaid.site/image-studio/compressor.html">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Image Compressor — Free Online Tool | Gamermaid">
  <meta name="twitter:description" content="Compress images and shrink file size with an adjustable quality slider, directly in your browser. Free, private, and instant.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-depth="1">

  <div id="site-header"></div>

  <main>
    <section class="section">
      <div class="container tool-page-layout" style="max-width: 900px;">

        <div class="tool-page-header">
          <div>
            <h1>Image Compressor</h1>
            <p class="lead" style="margin-top: var(--space-3);">
              Shrink your image's file size with an adjustable quality slider, right in your browser.
            </p>
          </div>
          <button type="button" class="btn-icon tool-fav-btn" id="fav-btn" aria-label="Add to favorites" aria-pressed="false">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 17.3l-6.16 3.73 1.64-7.03L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.48 4.76 1.64 7.03z"/></svg>
          </button>
        </div>

        <div id="upload-step">
          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload an image by clicking or dropping a file">
            <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
            <p><strong>Drag and drop</strong> an image here, or click to browse</p>
            <p class="dropzone-hint">JPG, PNG, or WEBP — up to 25MB</p>
          </div>
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" class="visually-hidden">
          <p id="upload-error" class="text-muted" role="alert" style="color: var(--color-danger); margin-top: var(--space-3); display:none;"></p>
        </div>

        <div id="edit-step" style="display:none;">
          <div class="field">
            <label for="quality-slider">Quality: <span class="range-value" id="quality-value">80%</span></label>
            <div class="range-row">
              <input type="range" id="quality-slider" min="1" max="100" value="80">
            </div>
          </div>

          <div class="flex gap-3" style="margin: var(--space-5) 0; flex-wrap: wrap;">
            <button type="button" class="btn btn-ghost" id="reset-btn">Reset</button>
          </div>

          <div class="tool-preview-grid">
            <div class="tool-preview-pane">
              <h3>Original</h3>
              <img id="original-preview" alt="Original uploaded image">
              <p class="file-meta" id="original-meta"></p>
            </div>
            <div class="tool-preview-pane">
              <h3>Compressed result</h3>
              <img id="result-preview" alt="Compressed image result" style="display:none;">
              <p class="file-meta" id="result-meta">Adjust the slider to compress.</p>
            </div>
          </div>

          <div class="result-actions">
            <button type="button" class="btn btn-secondary" id="download-btn" disabled>Download Result</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/search-index.js"></script>
  <script src="../assets/js/dropdown.js"></script>
  <script src="../assets/js/navbar.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/image-tools.js"></script>
  <script>
    (function () {
      "use strict";
      const SLUG = "compressor";
      const TITLE = "Image Compressor";
      const URL = "image-studio/compressor.html";

      if (window.GM_TRACK_TOOL_USE) window.GM_TRACK_TOOL_USE(SLUG, TITLE, URL);

      const favBtn = document.getElementById("fav-btn");
      function refreshFav() {
        const isFav = window.GM_IS_FAVORITE ? window.GM_IS_FAVORITE(SLUG) : false;
        favBtn.setAttribute("aria-pressed", String(isFav));
        favBtn.setAttribute("aria-label", isFav ? "Remove from favorites" : "Add to favorites");
      }
      favBtn.addEventListener("click", function () {
        if (window.GM_TOGGLE_FAVORITE) window.GM_TOGGLE_FAVORITE(SLUG, TITLE, URL);
        refreshFav();
      });
      refreshFav();

      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("file-input");
      const uploadStep = document.getElementById("upload-step");
      const editStep = document.getElementById("edit-step");
      const uploadError = document.getElementById("upload-error");
      const originalPreview = document.getElementById("original-preview");
      const originalMeta = document.getElementById("original-meta");
      const resultPreview = document.getElementById("result-preview");
      const resultMeta = document.getElementById("result-meta");
      const downloadBtn = document.getElementById("download-btn");
      const resetBtn = document.getElementById("reset-btn");
      const qualitySlider = document.getElementById("quality-slider");
      const qualityValue = document.getElementById("quality-value");

      let currentImage = null;
      let originalSize = 0;
      let resultDataUrl = null;

      window.GMImageTools.wireDropzone(dropzone, fileInput, handleFile);

      function handleFile(file) {
        const check = window.GMImageTools.validateImageFile(file);
        if (!check.valid) {
          uploadError.textContent = check.error;
          uploadError.style.display = "block";
          return;
        }
        uploadError.style.display = "none";

        window.GMImageTools.readImageFile(file).then((img) => {
          currentImage = img;
          originalSize = file.size;
          originalPreview.src = img.src;
          originalMeta.textContent = img.naturalWidth + " × " + img.naturalHeight + " px — " + window.GMImageTools.formatFileSize(file.size);
          uploadStep.style.display = "none";
          editStep.style.display = "block";
          resultPreview.style.display = "none";
          resultMeta.textContent = "Adjust the slider to compress.";
          downloadBtn.disabled = true;
          resultDataUrl = null;
          renderCompressed();
        }).catch((err) => {
          uploadError.textContent = err.message;
          uploadError.style.display = "block";
        });
      }

      function renderCompressed() {
        if (!currentImage) return;
        const quality = Number(qualitySlider.value) / 100;
        qualityValue.textContent = qualitySlider.value + "%";

        const canvas = document.createElement("canvas");
        canvas.width = currentImage.naturalWidth;
        canvas.height = currentImage.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImage, 0, 0);
        resultDataUrl = canvas.toDataURL("image/jpeg", quality);

        resultPreview.src = resultDataUrl;
        resultPreview.style.display = "inline-block";

        const estBytes = window.GMImageTools.estimateDataUrlBytes(resultDataUrl);
        const originalLabel = window.GMImageTools.formatFileSize(originalSize);
        const resultLabel = window.GMImageTools.formatFileSize(estBytes);
        const pct = originalSize ? Math.round((1 - estBytes / originalSize) * 100) : 0;
        resultMeta.textContent = resultLabel + " (from " + originalLabel + ")" + (pct > 0 ? " — " + pct + "% smaller" : "");
        downloadBtn.disabled = false;
      }

      qualitySlider.addEventListener("input", renderCompressed);

      downloadBtn.addEventListener("click", () => {
        if (!resultDataUrl) return;
        window.GMImageTools.downloadResult(resultDataUrl, "gamermaid-compressed.jpg");
      });

      resetBtn.addEventListener("click", () => {
        currentImage = null;
        resultDataUrl = null;
        fileInput.value = "";
        qualitySlider.value = 80;
        uploadStep.style.display = "block";
        editStep.style.display = "none";
        uploadError.style.display = "none";
      });
    })();
  </script>
</body>
</html>
