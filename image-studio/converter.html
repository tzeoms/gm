<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Converter — Free JPG, PNG, WEBP Converter | Gamermaid</title>
  <meta name="description" content="Convert images between JPG, PNG, and WEBP instantly in your browser. Free, private, no uploads required.">
  <link rel="canonical" href="https://gamermaid.site/image-studio/converter.html">

  <meta property="og:title" content="Image Converter — Free JPG, PNG, WEBP Converter | Gamermaid">
  <meta property="og:description" content="Convert images between JPG, PNG, and WEBP instantly in your browser. Free, private, no uploads required.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gamermaid.site/image-studio/converter.html">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Image Converter — Free JPG, PNG, WEBP Converter | Gamermaid">
  <meta name="twitter:description" content="Convert images between JPG, PNG, and WEBP instantly in your browser. Free, private, no uploads required.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-depth="1">

  <div id="site-header"></div>

  <main>
    <section class="section">
      <div class="container tool-page-layout" style="max-width: 900px;">

        <div class="tool-page-header">
          <div>
            <h1>Image Converter</h1>
            <p class="lead" style="margin-top: var(--space-3);">
              Convert your image between JPG, PNG, and WEBP formats, right in your browser.
            </p>
          </div>
          <button type="button" class="btn-icon tool-fav-btn" id="fav-btn" aria-label="Add to favorites" aria-pressed="false">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 17.3l-6.16 3.73 1.64-7.03L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.48 4.76 1.64 7.03z"/></svg>
          </button>
        </div>

        <div id="upload-step">
          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload an image by clicking or dropping a file">
            <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
            <p><strong>Drag and drop</strong> an image here, or click to browse</p>
            <p class="dropzone-hint">JPG, PNG, or WEBP — up to 25MB</p>
          </div>
          <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" class="visually-hidden">
          <p id="upload-error" class="text-muted" role="alert" style="color: var(--color-danger); margin-top: var(--space-3); display:none;"></p>
        </div>

        <div id="edit-step" style="display:none;">
          <div class="field">
            <label for="format-select">Output format</label>
            <div class="format-toggle-group" role="group" aria-label="Output format">
              <button type="button" class="toggle-chip is-active" data-format="image/jpeg" data-ext="jpg" aria-pressed="true">JPG</button>
              <button type="button" class="toggle-chip" data-format="image/png" data-ext="png" aria-pressed="false">PNG</button>
              <button type="button" class="toggle-chip" data-format="image/webp" data-ext="webp" aria-pressed="false">WEBP</button>
            </div>
          </div>

          <div class="flex gap-3" style="margin: var(--space-5) 0; flex-wrap: wrap;">
            <button type="button" class="btn btn-primary" id="process-btn">
              <span id="process-btn-label">Convert</span>
              <span class="spinner" id="process-spinner" style="display:none;" aria-hidden="true"></span>
            </button>
            <button type="button" class="btn btn-ghost" id="reset-btn">Reset</button>
          </div>

          <div class="tool-preview-grid">
            <div class="tool-preview-pane">
              <h3>Original</h3>
              <img id="original-preview" alt="Original uploaded image">
              <p class="file-meta" id="original-meta"></p>
            </div>
            <div class="tool-preview-pane">
              <h3>Converted result</h3>
              <img id="result-preview" alt="Converted image result" style="display:none;">
              <p class="file-meta" id="result-meta">Click Convert to generate the result.</p>
            </div>
          </div>

          <div class="result-actions">
            <button type="button" class="btn btn-secondary" id="download-btn" disabled>Download Result</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/search-index.js"></script>
  <script src="../assets/js/dropdown.js"></script>
  <script src="../assets/js/navbar.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/image-tools.js"></script>
  <script>
    (function () {
      "use strict";
      const SLUG = "converter";
      const TITLE = "Image Converter";
      const URL = "image-studio/converter.html";

      if (window.GM_TRACK_TOOL_USE) window.GM_TRACK_TOOL_USE(SLUG, TITLE, URL);

      const favBtn = document.getElementById("fav-btn");
      function refreshFav() {
        const isFav = window.GM_IS_FAVORITE ? window.GM_IS_FAVORITE(SLUG) : false;
        favBtn.setAttribute("aria-pressed", String(isFav));
        favBtn.setAttribute("aria-label", isFav ? "Remove from favorites" : "Add to favorites");
      }
      favBtn.addEventListener("click", function () {
        if (window.GM_TOGGLE_FAVORITE) window.GM_TOGGLE_FAVORITE(SLUG, TITLE, URL);
        refreshFav();
      });
      refreshFav();

      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("file-input");
      const uploadStep = document.getElementById("upload-step");
      const editStep = document.getElementById("edit-step");
      const uploadError = document.getElementById("upload-error");
      const originalPreview = document.getElementById("original-preview");
      const originalMeta = document.getElementById("original-meta");
      const resultPreview = document.getElementById("result-preview");
      const resultMeta = document.getElementById("result-meta");
      const processBtn = document.getElementById("process-btn");
      const processLabel = document.getElementById("process-btn-label");
      const processSpinner = document.getElementById("process-spinner");
      const downloadBtn = document.getElementById("download-btn");
      const resetBtn = document.getElementById("reset-btn");
      const formatButtons = document.querySelectorAll("[data-format]");

      let currentImage = null;
      let currentFormat = "image/jpeg";
      let currentExt = "jpg";
      let resultDataUrl = null;

      window.GMImageTools.wireDropzone(dropzone, fileInput, handleFile);

      function handleFile(file) {
        const check = window.GMImageTools.validateImageFile(file);
        if (!check.valid) {
          uploadError.textContent = check.error;
          uploadError.style.display = "block";
          return;
        }
        uploadError.style.display = "none";

        window.GMImageTools.readImageFile(file).then((img) => {
          currentImage = img;
          originalPreview.src = img.src;
          originalMeta.textContent = img.naturalWidth + " × " + img.naturalHeight + " px — " + window.GMImageTools.formatFileSize(file.size);
          uploadStep.style.display = "none";
          editStep.style.display = "block";
          resultPreview.style.display = "none";
          resultMeta.textContent = "Click Convert to generate the result.";
          downloadBtn.disabled = true;
          resultDataUrl = null;
        }).catch((err) => {
          uploadError.textContent = err.message;
          uploadError.style.display = "block";
        });
      }

      formatButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          formatButtons.forEach((b) => { b.classList.remove("is-active"); b.setAttribute("aria-pressed", "false"); });
          btn.classList.add("is-active");
          btn.setAttribute("aria-pressed", "true");
          currentFormat = btn.getAttribute("data-format");
          currentExt = btn.getAttribute("data-ext");
        });
      });

      processBtn.addEventListener("click", () => {
        if (!currentImage) return;
        processLabel.textContent = "Converting…";
        processSpinner.style.display = "inline-block";
        processBtn.disabled = true;

        setTimeout(() => {
          const canvas = document.createElement("canvas");
          canvas.width = currentImage.naturalWidth;
          canvas.height = currentImage.naturalHeight;
          const ctx = canvas.getContext("2d");
          if (currentFormat === "image/jpeg") {
            // JPG has no alpha channel — fill white first to avoid black backgrounds.
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
          ctx.drawImage(currentImage, 0, 0);
          resultDataUrl = canvas.toDataURL(currentFormat, 0.92);

          resultPreview.src = resultDataUrl;
          resultPreview.style.display = "inline-block";
          resultMeta.textContent = "Converted to " + currentExt.toUpperCase() + " — " + window.GMImageTools.formatFileSize(window.GMImageTools.estimateDataUrlBytes(resultDataUrl));
          downloadBtn.disabled = false;

          processLabel.textContent = "Convert";
          processSpinner.style.display = "none";
          processBtn.disabled = false;
        }, 400 + Math.random() * 300);
      });

      downloadBtn.addEventListener("click", () => {
        if (!resultDataUrl) return;
        window.GMImageTools.downloadResult(resultDataUrl, "gamermaid-converted." + currentExt);
      });

      resetBtn.addEventListener("click", () => {
        currentImage = null;
        resultDataUrl = null;
        fileInput.value = "";
        uploadStep.style.display = "block";
        editStep.style.display = "none";
        uploadError.style.display = "none";
      });
    })();
  </script>
</body>
</html>
